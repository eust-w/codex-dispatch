<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Dispatch</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-frame">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark">CD</div>
          <div>
            <h1>Codex Dispatch</h1>
            <p data-i18n="appSubtitle">真实 Codex CLI 任务队列控制台</p>
          </div>
        </div>
        <div id="globalStats" class="global-stats" aria-live="polite"></div>
        <div class="header-actions">
          <select id="languageSelect" class="language-select" aria-label="Language">
            <option value="zh-CN">中文</option>
            <option value="en">English</option>
          </select>
          <button id="refreshButton" class="icon-button" title="刷新" data-i18n-title="refresh">↻</button>
        </div>
      </header>

    <main class="shell">
      <section class="pane pane-projects">
        <header class="pane-header">
          <div>
            <h2 data-i18n="projects">项目</h2>
            <p data-i18n="projectsHint">工作目录与会话入口</p>
          </div>
        </header>
        <form id="projectForm" class="stack-form">
          <input name="name" placeholder="新项目名称" data-i18n-placeholder="newProjectName" autocomplete="off" required />
          <input name="cwd" placeholder="项目目录，默认当前启动目录" data-i18n-placeholder="projectDirectoryPlaceholder" autocomplete="off" />
          <textarea name="description" rows="2" placeholder="描述" data-i18n-placeholder="description"></textarea>
          <button type="submit" data-i18n="createProject">创建项目</button>
        </form>
        <div id="projects" class="list"></div>
      </section>

      <section class="pane pane-sessions">
        <header class="pane-header">
          <div>
            <h2 data-i18n="sessions">会话</h2>
            <p id="selectedProjectName" data-i18n="selectProject">选择一个项目</p>
          </div>
        </header>
        <form id="sessionForm" class="stack-form">
          <input name="name" placeholder="新会话名称" data-i18n-placeholder="newSessionName" autocomplete="off" required />
          <label class="check-row">
            <input name="shadow_context_enabled" type="checkbox" />
            <span data-i18n="enableShadowContext">启用 Shadow Context</span>
          </label>
          <button type="submit" data-i18n="createSession">创建会话</button>
        </form>
        <div id="sessions" class="list"></div>
      </section>

      <section class="pane pane-tasks">
        <header class="pane-header">
          <div>
            <h2 data-i18n="taskQueue">任务队列</h2>
            <p id="selectedSessionName" data-i18n="selectSession">选择一个会话</p>
          </div>
          <div class="task-header-tools">
            <span id="queueSummary" class="queue-summary"></span>
            <div id="taskFilters" class="task-filters"></div>
          </div>
        </header>
        <form id="taskForm" class="task-form">
          <textarea
            name="prompt"
            rows="5"
            placeholder="将通过 codex exec &quot;prompt&quot; 执行的 Prompt"
            data-i18n-placeholder="taskPromptPlaceholder"
            required
          ></textarea>
          <button type="submit" data-i18n="enqueueTask">加入队列</button>
        </form>
        <div id="tasks" class="task-list"></div>
      </section>
    </main>
    </div>

    <div id="toast" class="toast" hidden></div>
    <script src="/app.js?v=20260618-5"></script>
  </body>
</html>
